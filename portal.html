<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITA-TECH Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050508;
            overflow-x: hidden;
        }

        .hacker-font {
            font-family: 'Share Tech Mono', monospace;
        }

        .animated-card {
            background: rgba(10, 15, 12, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.4);
            box-shadow: 0 0 35px rgba(34, 197, 94, 0.25), inset 0 0 20px rgba(34, 197, 94, 0.1);
        }

        /* Hero Panel Container */
        .hero-panel {
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }

        /* Hacker Image Background Overlay & FX */
        .hacker-img-bg {
            background-image: url('download (45).jpg');
            background-size: cover;
            background-position: center;
            filter: contrast(1.15) brightness(0.9);
            animation: imgGlow 3s ease-in-out infinite alternate;
        }

        @keyframes imgGlow {
            0% { filter: contrast(1.1) brightness(0.85); }
            100% { filter: contrast(1.25) brightness(1.05) drop-shadow(0 0 15px rgba(34, 197, 94, 0.6)); }
        }

        /* Laser Scan Line */
        .scan-line {
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(220%); opacity: 0; }
        }

        /* Cyberpunk Glitch Text */
        .cyber-glitch {
            animation: glitchText 2.5s infinite;
        }

        @keyframes glitchText {
            0%, 100% { transform: translate(0); text-shadow: 0 0 8px rgba(34, 197, 94, 0.9); }
            20% { transform: translate(-1px, 1px); text-shadow: -1px 0 #ef4444, 1px 0 #22c55e; }
            40% { transform: translate(1px, -1px); text-shadow: 1px 0 #3b82f6, -1px 0 #22c55e; }
            60% { transform: translate(0); }
        }

        .animated-input {
            transition: all 0.25s ease;
        }
        .animated-input:focus {
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.5), inset 0 0 6px rgba(34, 197, 94, 0.25);
            border-color: #22c55e;
        }

        .fade-slide-in {
            animation: fadeSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 767px) { 
            input, select, textarea { font-size: 11px !important; } 
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between relative selection:bg-green-500 selection:text-black">

    <header class="border-b border-zinc-800/80 bg-[#050508]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-3 h-10 flex items-center justify-between">
            <div class="font-black tracking-tight text-white text-xs sm:text-sm flex items-center gap-1">
                <i class="fa-solid fa-graduation-cap text-green-500"></i>
                SITA-TECH <span class="text-green-500 hacker-font">[PORTAL]</span>
            </div>
            <div class="flex items-center gap-1">
                <a class="px-2 py-1 rounded bg-zinc-800/90 hover:bg-zinc-700 text-white text-[10px] font-semibold transition-all flex items-center gap-1 border border-zinc-700/50" href="index.html">
                    <i class="fa-solid fa-house text-[9px]"></i> <span>Site</span>
                </a>
                <button class="px-2 py-1 rounded bg-red-900/40 hover:bg-red-800/60 text-red-200 text-[10px] font-semibold transition-all hidden border border-red-800/50 flex items-center gap-1" id="out" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket text-[9px]"></i> Log out
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-2 pt-2 sm:pt-4 pb-4 w-full flex-grow flex items-start justify-center z-10">

        <!-- AUTHENTICATION CARD -->
        <div id="authContainer" class="w-full animated-card rounded-xl overflow-hidden grid grid-cols-12 fade-slide-in relative">
            
            <!-- Left Side Panel with Hacker Image -->
            <div class="col-span-5 hero-panel p-2.5 sm:p-4 flex flex-col justify-between relative overflow-hidden text-white">
                
                <!-- Hacker Image Background Overlay -->
                <div class="absolute inset-0 hacker-img-bg pointer-events-none"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent pointer-events-none"></div>
                <div class="absolute inset-0 bg-green-500/10 mix-blend-color-dodge pointer-events-none"></div>

                <!-- Laser Scan Line -->
                <div class="absolute inset-0 bg-gradient-to-b from-green-400/0 via-green-400/40 to-green-400/0 scan-line pointer-events-none"></div>

                <div class="relative z-10">
                    <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-black/80 text-green-400 text-[8px] sm:text-[9px] hacker-font font-bold uppercase tracking-wider mb-1 border border-green-500/60 shadow-md shadow-green-500/40">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-ping"></span> TECH LMS
                    </span>
                    <h2 class="text-xs sm:text-xl font-black tracking-tight leading-tight cyber-glitch">
                        AUTHENTICATE
                    </h2>
                    
                    <div class="hacker-font text-[7px] sm:text-[8px] text-green-300 mt-1 space-y-0.5 pointer-events-none select-none bg-black/60 p-1 rounded border border-green-500/30">
                        <p class="truncate text-green-400">&gt; AUTH_KEY: READY</p>
                        <p class="truncate text-emerald-300">&gt; RSA_4096_ACTIVE</p>
                    </div>
                </div>

                <div class="pt-2 border-t border-green-500/40 relative z-10 flex flex-col gap-1 text-[9px] text-green-300 hacker-font bg-black/60 p-1 rounded">
                    <div class="flex items-center gap-1.5">
                        <i class="fa-solid fa-terminal text-green-400 text-[9px] animate-pulse"></i>
                        <span class="truncate">STUDENT PORTAL</span>
                    </div>
                </div>
            </div>

            <!-- Right Side Form Panel -->
            <div class="col-span-7 p-2.5 sm:p-5 flex flex-col justify-center">
                
                <!-- LOGIN FORM -->
                <div id="login">
                    <div class="mb-1.5 sm:mb-2.5">
                        <span class="text-green-500 font-bold text-[8px] sm:text-[9px] uppercase tracking-widest flex items-center gap-1 hacker-font">
                            <i class="fa-solid fa-user-shield text-green-400 animate-pulse"></i> Handshake Required
                        </span>
                        <h1 class="text-xs sm:text-lg font-black text-white mt-0">Student Login</h1>
                    </div>

                    <div class="space-y-1.5 sm:space-y-2">
                        <div>
                            <label class="block text-[9px] sm:text-[10px] font-semibold text-zinc-300 mb-0.5">Email address</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-green-500 text-[9px]"><i class="fa-regular fa-envelope"></i></span>
                                <input class="animated-input w-full bg-zinc-950/90 border border-zinc-800 outline-none rounded py-1 pl-6 pr-2 text-[10px] sm:text-xs text-white" id="ln" type="email" placeholder="you@example.com" autocomplete="username">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[9px] sm:text-[10px] font-semibold text-zinc-300 mb-0.5">Password</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-green-500 text-[9px]"><i class="fa-solid fa-key"></i></span>
                                <input class="animated-input w-full bg-zinc-950/90 border border-zinc-800 outline-none rounded py-1 pl-6 pr-2 text-[10px] sm:text-xs text-white" id="lp" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
                            </div>
                        </div>

                        <button class="w-full py-1.5 sm:py-2 rounded bg-gradient-to-r from-green-600 via-emerald-500 to-green-500 hover:from-green-500 hover:to-emerald-400 text-white font-black text-[10px] sm:text-xs shadow-lg shadow-green-900/50 active:scale-[0.98] transition-all duration-150 mt-0.5 hacker-font uppercase tracking-wider" onclick="login()">
                            Decrypt &amp; Log In &gt;&gt;
                        </button>
                        
                        <div class="err text-[10px] text-red-400 bg-red-950/40 border border-red-800/50 p-1 rounded hidden" id="le"></div>

                        <div class="pt-0.5 text-center">
                            <button class="text-[9px] sm:text-[10px] font-medium text-zinc-400 hover:text-green-400 transition-colors hacker-font" id="resetRequestButton" onclick="requestPasswordReset()">[Forgot password?]</button>
                            <div class="err text-[9px] text-green-400 mt-0.5" id="resetMessage" role="status"></div>
                        </div>

                        <div class="border-t border-zinc-800/80 pt-1 text-center">
                            <p class="text-[9px] text-zinc-400">No login? <a href="enroll.html" class="text-green-400 font-bold hover:underline hacker-font">Enroll now</a></p>
                        </div>
                    </div>
                </div>

                <!-- PASSWORD RESET FORM -->
                <div id="passwordReset" class="hidden">
                    <div class="mb-2">
                        <span class="text-green-500 font-bold text-[8px] uppercase tracking-widest hacker-font">&gt; RECOVERY</span>
                        <h2 class="text-xs sm:text-sm font-black text-white mt-0.5">Choose new password</h2>
                    </div>

                    <div class="space-y-1.5">
                        <div>
                            <label class="block text-[9px] font-semibold text-zinc-300 mb-0.5">New Password</label>
                            <input class="animated-input w-full bg-zinc-950/90 border border-zinc-800 outline-none rounded py-1 px-2 text-[10px] sm:text-xs text-white" id="newPassword" type="password" autocomplete="new-password" placeholder="Min 8 chars">
                        </div>

                        <div>
                            <label class="block text-[9px] font-semibold text-zinc-300 mb-0.5">Confirm Password</label>
                            <input class="animated-input w-full bg-zinc-950/90 border border-zinc-800 outline-none rounded py-1 px-2 text-[10px] sm:text-xs text-white" id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter" onkeydown="if(event.key==='Enter')saveNewPassword()">
                        </div>

                        <button class="w-full py-1.5 rounded bg-gradient-to-r from-green-600 to-emerald-500 text-white font-extrabold text-[10px] sm:text-xs shadow-md transition-all hacker-font uppercase" onclick="saveNewPassword()">
                            Update Key
                        </button>
                        
                        <div class="err text-[10px] text-red-400 bg-red-950/40 border border-red-800/50 p-1 rounded mt-1" id="passwordResetMessage" role="status"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- LOGGED-IN PORTAL DASHBOARD -->
        <div id="app" class="hidden w-full space-y-2 fade-slide-in">
            <div class="animated-card p-2.5 rounded-xl border border-zinc-800">
                <span class="text-green-500 font-bold text-[8px] uppercase tracking-widest hacker-font">&gt; STUDENT SESSION ACTIVE</span>
                <h2 class="text-xs sm:text-base font-black text-white mt-0.5" id="hi"></h2>
                <p class="text-zinc-400 text-[10px] mt-0.5" id="sub"></p>
            </div>

            <div class="err text-[10px] text-red-400 bg-red-950/40 border border-red-800/50 p-1 rounded hidden" id="portalError" role="status"></div>

            <div class="grid grid-cols-2 gap-1 bg-zinc-950/60 p-1 rounded border border-zinc-800/80">
                <button id="t1" class="py-1 px-2 rounded text-[10px] font-bold transition-all text-white bg-green-600/20 border border-green-500/40 hacker-font" onclick="tab(1)">
                    <i class="fa-solid fa-book-open mr-1"></i> Courses
                </button>
                <button id="t2" class="py-1 px-2 rounded text-[10px] font-bold transition-all text-zinc-400 hover:text-white hacker-font" onclick="tab(2)">
                    <i class="fa-solid fa-video mr-1"></i> Live classes
                </button>
            </div>

            <div id="v1" class="space-y-1.5"></div>
            <div id="v2" class="hidden space-y-1.5"></div>
        </div>

    </main>

    <script type="module">
        import { supabase } from './supabaseClient.js';
        
        const CO=[
        ['comp','Computer Packages','fa-computer',[['Word: your first document','## Getting started\nOpen Word, choose Blank document and type. Save often with Ctrl+S.\n- Bold Ctrl+B, Italic Ctrl+I, Underline Ctrl+U\n- Use Heading styles for titles so a contents page can be made\n- Insert a table from Insert, then Table'],['Excel: formulas that matter','## Formulas\nEvery formula starts with =.\n- =SUM(A1:A10) adds a range\n- =AVERAGE(B1:B10) finds the average\n- =IF(C2>=50,"Pass","Fail") tests a condition\nUse Sort and Filter on the Data tab to organise lists.'],['PowerPoint: clear slides','## Good slides\nOne idea per slide, large text, few words. Use the Design tab for a theme and Insert for pictures. Press F5 to present.'],['Internet & Email','## Safe email\nWrite a clear subject, attach files with the paperclip, and check the address before sending. Never open attachments from people you do not know.']]],
        ['web','Web Design','fa-laptop-code',[['HTML: the structure','## HTML\nHTML describes content using tags.\n- <h1> main heading, <p> paragraph\n- <a href="..."> link, <img src="..."> picture\n- <ul><li> lists\nSave a file as index.html and open it in a browser.'],['CSS: the style','## CSS\nCSS controls colour, size and layout.\n- color, background, font-size\n- margin outside, padding inside\n- display:flex lines items up in a row\nAdd it in a <style> tag or a .css file.'],['JavaScript: make it react','## JavaScript\nJavaScript runs when something happens.\n- document.querySelector finds an element\n- addEventListener("click", fn) reacts to a click\nStart by changing text when a button is pressed.'],['Responsive sites','## Responsive\nAdd <meta name="viewport" content="width=device-width, initial-scale=1"> and use percentages, rem and max-width so the page fits phones and computers.']]],
        ['gfx','Graphic Design','fa-palette',[['Design basics','## Four rules\n- Contrast: make important things stand out\n- Repetition: reuse colours and fonts\n- Alignment: line things up\n- Space: leave breathing room'],['Canva: poster in 10 minutes','## Poster steps\nPick a template, change the text, replace images with your own, keep to two fonts and three colours, then Share and Download as PNG or PDF.'],['Logos that work','## Logo tips\nKeep it simple, make sure it works in one colour, and test it small. Save a PNG with a transparent background.']]],
        ['hw','Computer Hardware & Repair','fa-screwdriver-wrench',[['Inside a computer','## Main parts\n- CPU: the brain\n- RAM: short-term memory\n- SSD or HDD: storage\n- Motherboard: connects everything\n- PSU: power supply'],['Diagnose a fault','## Method\nAsk when it started, check power and cables, listen for beeps, test with known-good parts, change one thing at a time.'],['Install Windows','## Steps\nBack up files, make a bootable USB with the official Windows tool, boot from it, choose the drive, install, then update drivers and install an antivirus.']]],
        ['por','Digital Portal Skills','fa-landmark',[['Account basics','## Before you start\nUse your own email and phone, keep a strong password, and write down what you submit. Never share OTP codes with anyone.'],['Working with the portals','## Common portals\nKRA (iTax) for tax, eCitizen for government services, SHA for health cover and HELB for student loans. Always confirm the web address before logging in.'],['Helping others safely','## Good practice\nAgree the price first, never keep other people\'s passwords, and give the client a copy of what you submitted.']]],
        ['vid','Video Editing & Content','fa-film',[['Plan your video','## Plan first\nWrite the goal, the hook (first 3 seconds), the main points and a call to action. Shoot in good light and keep sound clear.'],['CapCut basics','## Editing flow\nImport clips, trim, add captions, add music at low volume, then export in 1080p. Vertical 9:16 suits Reels and Shorts.'],['Thumbnails','## Thumbnails\nOne face or object, big readable words (3 or fewer), strong contrast.']]],
        ['cyb','Cyber Safety & Security','fa-user-shield',[['Strong passwords','## Rules\n- Long beats complex: use a phrase of 4 words or more\n- Never reuse a password\n- Turn on two-step verification\n- Use a password manager'],['Spot phishing','## Warning signs\nUrgent threats, odd sender addresses, links that do not match the real site, requests for PINs or OTP. When unsure, go to the website yourself.'],['Secure your devices','## Habits\nInstall updates, lock your screen, back up important files, and avoid public Wi-Fi for banking.']]],
        ['prog','Programming Basics','fa-code',[['Thinking like a programmer','## Logic\nBreak a problem into small steps. Write the steps in plain words first (pseudocode), then in code.'],['Python: first steps','## Python\nname = input("Name: ")\nprint("Hello", name)\n- Variables store values\n- if / else make decisions\n- for loops repeat'],['Mini project','## Try this\nBuild a number guessing game: pick a random number, ask for guesses, and say higher or lower until correct.']]]
        ];

        const E = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const Q = i => document.getElementById(i);
        
        let me = null, completed = new Set(), classSessions = [];
        let isPasswordRecovery = false;

        function txt(t) {
            let o = '', u = 0;
            t.split('\n').forEach(l => {
                if (l.startsWith('- ')) {
                    if (!u) { o += '<ul class="list-disc pl-3 my-0.5 space-y-0.5 text-zinc-300 text-[10px]">'; u = 1; }
                    o += '<li>' + E(l.slice(2)) + '</li>';
                } else {
                    if (u) { o += '</ul>'; u = 0; }
                    o += l.startsWith('## ') 
                        ? '<h4 class="text-[11px] font-bold text-green-400 mt-1 mb-0.5">' + E(l.slice(3)) + '</h4>' 
                        : '<p class="text-[10px] text-zinc-300 my-0.5 leading-snug">' + E(l) + '</p>';
                }
            });
            return o + (u ? '</ul>' : '');
        }

        function showError(message, target = 'portalError') {
            const el = Q(target);
            if (!message) {
                el.classList.add('hidden');
                el.textContent = '';
            } else {
                el.textContent = message;
                el.classList.remove('hidden');
            }
        }

        function getSignInErrorMessage(error) {
            if (error.code === 'invalid_credentials') return 'Email or password incorrect.';
            if (error.code === 'email_not_confirmed') return 'Confirm email link first.';
            if (error.status === 401 && /api key/i.test(error.message || '')) return 'Supabase rejected key.';
            if (error.name === 'AuthRetryableFetchError' || error instanceof TypeError) return 'Connection error.';
            return 'Sign-in failed.';
        }

        function getPasswordUpdateErrorMessage(error) {
            if (error.code === 'weak_password') return error.message || 'Password too weak.';
            if (error.code === 'session_not_found' || error.name === 'AuthSessionMissingError') return 'Link expired.';
            if (error.code === 'otp_expired' || error.code === 'bad_code_verifier') return 'Link expired.';
            return 'Password update failed.';
        }

        function showPasswordReset() {
            isPasswordRecovery = true;
            Q('login').classList.add('hidden');
            Q('passwordReset').classList.remove('hidden');
        }

        async function requestPasswordReset() {
            const email = Q('ln').value.trim();
            Q('resetMessage').textContent = '';
            if (!email) { Q('resetMessage').textContent = 'Enter email above first.'; return; }
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://sita-tech.co.ke/portal.html?mode=reset'
                });
                if (error) throw error;
                Q('resetMessage').textContent = 'Reset link sent if email exists.';
            } catch (error) {
                Q('resetMessage').textContent = 'Could not send reset link.';
                console.error('Password reset failed:', error);
            }
        }

        async function saveNewPassword() {
            const password = Q('newPassword').value, confirmation = Q('confirmPassword').value;
            showError('', 'passwordResetMessage');
            if (password.length < 8) { showError('Use at least 8 chars.', 'passwordResetMessage'); return; }
            if (password !== confirmation) { showError('Passwords do not match.', 'passwordResetMessage'); return; }
            try {
                const { error } = await supabase.auth.updateUser({ password });
                if (error) throw error;
                isPasswordRecovery = false;
                Q('passwordReset').classList.add('hidden');
                Q('login').classList.remove('hidden');
                Q('lp').value = '';
                showError('Password updated. Sign in now.', 'le');
                await supabase.auth.signOut();
            } catch (error) {
                showError(getPasswordUpdateErrorMessage(error), 'passwordResetMessage');
                console.error('Password update error:', error);
            }
        }

        async function loadAccount(user) {
            showError('');
            const { data: enrollments, error: enrollmentError } = await supabase.from('sita_enrollments').select('course_code').eq('status', 'active');
            if (enrollmentError) throw enrollmentError;
            
            me = { id: user.id, courses: enrollments.map(row => row.course_code) };
            
            const [{ data: progress, error: progressError }, { data: sessions, error: sessionsError }] = await Promise.all([
                supabase.from('sita_module_progress').select('course_code,module_key'),
                supabase.from('sita_class_sessions').select('title,course_code,starts_at,meeting_url').order('starts_at')
            ]);
            
            if (progressError) throw progressError;
            if (sessionsError) throw sessionsError;
            
            completed = new Set(progress.map(row => row.course_code + row.module_key));
            classSessions = sessions;
            
            Q('authContainer').classList.add('hidden');
            Q('app').classList.remove('hidden');
            Q('out').classList.remove('hidden');
            
            Q('hi').textContent = 'Welcome, ' + (user.user_metadata.full_name || user.email || 'Student');
            Q('sub').textContent = 'Enrolled in: ' + me.courses.map(c => (CO.find(x => x[0] === c) || [])[1]).filter(Boolean).join(', ');
            tab(1);
        }

        async function login() {
            showError('', 'le');
            const email = Q('ln').value.trim(), password = Q('lp').value;
            if (!email || !password) return showError('Enter email and password.', 'le');
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                await loadAccount(data.user);
            } catch (error) {
                showError(getSignInErrorMessage(error), 'le');
                console.error('Sign-in failed:', error);
            }
        }

        async function logout() {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) throw error;
                me = null; completed.clear(); classSessions = [];
                Q('authContainer').classList.remove('hidden');
                Q('app').classList.add('hidden');
                Q('out').classList.add('hidden');
            } catch (error) {
                showError('Could not sign out.');
                console.error('Sign-out failed:', error);
            }
        }

        function tab(n) {
            const btn1 = Q('t1'), btn2 = Q('t2');
            if (n === 1) {
                btn1.className = "py-1 px-2 rounded text-[10px] font-bold transition-all text-white bg-green-600/20 border border-green-500/40 hacker-font";
                btn2.className = "py-1 px-2 rounded text-[10px] font-bold transition-all text-zinc-400 hover:text-white hacker-font";
                Q('v1').classList.remove('hidden');
                Q('v2').classList.add('hidden');
                courses();
            } else {
                btn2.className = "py-1 px-2 rounded text-[10px] font-bold transition-all text-white bg-green-600/20 border border-green-500/40 hacker-font";
                btn1.className = "py-1 px-2 rounded text-[10px] font-bold transition-all text-zinc-400 hover:text-white hacker-font";
                Q('v2').classList.remove('hidden');
                Q('v1').classList.add('hidden');
                classes();
            }
        }

        function courses() {
            Q('v1').innerHTML = CO.filter(c => me && me.courses.includes(c[0])).map(c => {
                const t = c[3].length;
                const k = c[3].filter((_, i) => completed.has(c[0] + c[0] + i)).length;
                const pct = Math.round((k / t) * 100);
                
                return `<div class="animated-card p-2.5 rounded-lg border border-zinc-800 space-y-1.5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold text-white flex items-center gap-1">
                            <i class="fa-solid ${c[2]} text-green-500"></i> ${E(c[1])}
                        </h3>
                        <span class="text-[8px] font-bold px-1 py-0.5 rounded bg-green-500/10 text-green-400 border border-green-500/20 hacker-font">${pct}%</span>
                    </div>
                    
                    <div class="h-1 rounded bg-zinc-950 overflow-hidden border border-zinc-800">
                        <div class="h-full bg-gradient-to-r from-green-600 to-emerald-400 transition-all duration-300" style="width:${pct}%"></div>
                    </div>

                    <div class="grid grid-cols-1 gap-1 pt-0.5">
                        ${c[3].map((l, i) => {
                            const isDone = completed.has(c[0] + c[0] + i);
                            return `<div class="flex items-center justify-between p-1.5 rounded border ${isDone ? 'bg-zinc-900/60 border-green-500/30 text-green-300' : 'bg-zinc-950/80 border-zinc-800/80 text-zinc-300'} cursor-pointer" onclick="les('${c[0]}',${i})">
                                <div class="flex items-center gap-1 text-[10px] font-medium">
                                    <i class="fa-solid fa-circle-check ${isDone ? 'text-green-400' : 'text-zinc-600'}"></i>
                                    <span>${E(l[0])}</span>
                                </div>
                                <i class="fa-solid fa-chevron-right text-[8px] text-zinc-600"></i>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }).join('') || '<div class="animated-card p-3 rounded-lg text-center"><p class="text-zinc-400 text-[10px] hacker-font">No courses assigned.</p></div>';
        }

        function les(c, i) {
            const C = CO.find(x => x[0] === c), l = C[3][i], key = c + c + i;
            const isDone = completed.has(key);
            
            Q('v1').innerHTML = `
                <div class="animated-card p-2.5 rounded-lg border border-zinc-800 space-y-2 fade-slide-in">
                    <button class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-white text-[9px] font-semibold transition-all flex items-center gap-1 hacker-font" onclick="courses()">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </button>
                    
                    <div class="border-b border-zinc-800/80 pb-1">
                        <span class="text-[8px] text-green-500 font-bold uppercase tracking-wider hacker-font">${E(C[1])}</span>
                        <h2 class="text-xs font-black text-white mt-0.5">${E(l[0])}</h2>
                    </div>

                    <div class="bg-zinc-950/60 p-2 rounded border border-zinc-800/80 leading-snug">
                        ${txt(l[1])}
                    </div>

                    <button class="w-full py-1.5 rounded ${isDone ? 'bg-zinc-800 text-green-400 border border-green-500/30' : 'bg-gradient-to-r from-green-600 to-emerald-500 text-white'} font-black text-[10px] shadow-md transition-all hacker-font uppercase" onclick="done('${c}',${i})">
                        <i class="fa-solid ${isDone ? 'fa-check-double' : 'fa-check'} mr-1"></i> ${isDone ? 'Marked done' : 'Mark as done'}
                    </button>
                </div>
            `;
        }

        async function done(c, i) {
            if (!me) return;
            const key = c + c + i;
            if (completed.has(key)) return courses();
            try {
                const { error } = await supabase.from('sita_module_progress').upsert({
                    student_id: me.id,
                    course_code: c,
                    module_key: c + i,
                    completed_at: new Date().toISOString()
                }, { onConflict: 'student_id,course_code,module_key' });
                
                if (error) throw error;
                completed.add(key);
                showError('');
                courses();
            } catch (error) {
                showError('Could not save progress.');
                console.error('Lesson progress update error:', error);
            }
        }

        function classes() {
            const now = Date.now();
            const l = classSessions.filter(c => c.course_code === 'all' || me.courses.includes(c.course_code)).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
            
            Q('v2').innerHTML = l.map(c => {
                const t = new Date(c.starts_at).getTime();
                const on = now > t - 18e5 && now < t + 108e5;
                const isPast = t < now - 108e5;

                return `<div class="animated-card p-2.5 rounded-lg border ${on ? 'border-green-500' : 'border-zinc-800'} space-y-1.5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold text-white">${E(c.title)}</h3>
                        ${on ? '<span class="px-1 py-0.5 rounded bg-green-500/20 text-green-400 border border-green-500/40 text-[8px] font-black uppercase hacker-font">● Live Stream</span>' : ''}
                    </div>
                    <p class="text-[10px] text-zinc-400 flex items-center gap-1 hacker-font">
                        <i class="fa-regular fa-clock text-green-500"></i> ${new Date(c.starts_at).toLocaleString()} ${isPast ? '(Finished)' : ''}
                    </p>
                    <a class="block w-full text-center py-1.5 rounded ${on ? 'bg-gradient-to-r from-green-600 to-emerald-500 text-white font-extrabold' : 'bg-zinc-800 text-zinc-200 font-bold'} text-[10px] hacker-font uppercase" target="_blank" rel="noopener" href="${E(c.meeting_url)}">
                        <i class="fa-solid fa-video mr-1"></i> ${on ? 'Join stream now' : 'Open class link'}
                    </a>
                </div>`;
            }).join('') || '<div class="animated-card p-3 rounded-lg text-center"><p class="text-zinc-400 text-[10px] hacker-font">No live classes scheduled.</p></div>';
        }

        Object.assign(window, { login, logout, tab, courses, les, done, requestPasswordReset, saveNewPassword });

        try {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error) throw error;
            if (new URLSearchParams(location.search).get('mode') === 'reset' && session) showPasswordReset();
            else if (session) await loadAccount(session.user);
        } catch (error) {
            showError('Could not restore session.', 'le');
            console.error('Session restore failed:', error);
        }

        supabase.auth.onAuthStateChange((event) => {
            if (event === 'PASSWORD_RECOVERY') showPasswordReset();
        });
    </script>
</body>
</html>
