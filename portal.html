<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITA-TECH Student Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>

body{font-family:Inter,system-ui,sans-serif;background:#0A0A0C;color:#e4e4e7;min-height:100vh;background-image:linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px);background-size:48px 48px}
.w{max-width:44rem;margin:0 auto;padding:.75rem}.top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem 0}
.brand{font-weight:900;font-size:1rem;color:#fff}.brand b{color:#22c55e}

.in{width:100%;background:#09090b;border:1px solid #27272a;border-radius:.7rem;padding:.6rem;color:#fff;font-size:16px;margin-top:.4rem}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.55rem .8rem;border-radius:.7rem;background:#16a34a;color:#fff;font-weight:800;font-size:.72rem;border:0;cursor:pointer;text-decoration:none}
.b.f{width:100%;margin-top:.5rem}.b.g{background:#27272a}.b.r{background:#b91c1c}.b.y{background:#ca8a04}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:.3rem;margin-top:.4rem}.tabs button{padding:.5rem;border-radius:.6rem;background:#18181b;border:1px solid #27272a;color:#a1a1aa;font-weight:700;font-size:.68rem;cursor:pointer}.tabs button.on{background:rgba(34,197,94,.18);color:#fff;border-color:#22c55e}
.les{display:flex;align-items:center;gap:.5rem;padding:.55rem;border:1px solid #27272a;border-radius:.7rem;margin-top:.35rem;background:#18181b;cursor:pointer;font-size:.72rem;color:#fff}.les.done i{color:#22c55e}
.bar{height:.35rem;border-radius:9px;background:#27272a;margin-top:.4rem;overflow:hidden}.bar i{display:block;height:100%;background:#22c55e}
.tx h4{color:#fff;font-size:.78rem;margin:.6rem 0 .2rem}.tx p,.tx li{color:#d4d4d8;margin-top:.25rem}.tx ul{padding-left:1.1rem}

table{width:100%;border-collapse:collapse}td{font-size:.68rem;padding:.4rem .2rem;border-bottom:1px solid #27272a;vertical-align:middle}
</style></head><body><div class="w">
<div class="top"><div class="brand"><i class="fa-solid fa-graduation-cap" style="color:#22c55e"></i> SITA-TECH <b>Student Portal</b></div><div><a class="b g" href="index.html"><i class="fa-solid fa-house"></i> Site</a> <button class="b g hide" id="out" onclick="logout()">Log out</button></div></div>

<div id="login" class="card"><h2><i class="fa-solid fa-lock" style="color:#22c55e"></i> Student login</h2>
<p>Use the email and password for your SITA-TECH student account.</p>
<input class="in" id="ln" type="email" placeholder="Email address" autocomplete="username"><input class="in" id="lp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
<button class="b f" onclick="login()">Log in</button><div class="err" id="le"></div>
<p style="margin-top:.6rem">No login yet? <a href="enroll.html" style="color:#4ade80">Enroll for a course</a> and pay your fee. We confirm payment and send your login.</p></div>

<div id="app" class="hide"><div class="card"><h2 id="hi"></h2><p id="sub"></p></div>
<div class="err" id="portalError" role="status"></div>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">My courses</button><button id="t2" onclick="tab(2)">Live classes</button></div>
<div id="v1"></div><div id="v2" class="hide"></div></div>

<script type="module">
import { supabase } from './supabaseClient.js';
const CO=[
['comp','Computer Packages','fa-computer',[['Word: your first document','## Getting started\nOpen Word, choose Blank document and type. Save often with Ctrl+S.\n- Bold Ctrl+B, Italic Ctrl+I, Underline Ctrl+U\n- Use Heading styles for titles so a contents page can be made\n- Insert a table from Insert, then Table'],['Excel: formulas that matter','## Formulas\nEvery formula starts with =.\n- =SUM(A1:A10) adds a range\n- =AVERAGE(B1:B10) finds the average\n- =IF(C2>=50,"Pass","Fail") tests a condition\nUse Sort and Filter on the Data tab to organise lists.'],['PowerPoint: clear slides','## Good slides\nOne idea per slide, large text, few words. Use the Design tab for a theme and Insert for pictures. Press F5 to present.'],['Internet & Email','## Safe email\nWrite a clear subject, attach files with the paperclip, and check the address before sending. Never open attachments from people you do not know.']]],

['gfx','Graphic Design','fa-palette',[['Design basics','## Four rules\n- Contrast: make important things stand out\n- Repetition: reuse colours and fonts\n- Alignment: line things up\n- Space: leave breathing room'],['Canva: poster in 10 minutes','## Poster steps\nPick a template, change the text, replace images with your own, keep to two fonts and three colours, then Share and Download as PNG or PDF.'],['Logos that work','## Logo tips\nKeep it simple, make sure it works in one colour, and test it small. Save a PNG with a transparent background.']]],
['hw','Computer Hardware & Repair','fa-screwdriver-wrench',[['Inside a computer','## Main parts\n- CPU: the brain\n- RAM: short-term memory\n- SSD or HDD: storage\n- Motherboard: connects everything\n- PSU: power supply'],['Diagnose a fault','## Method\nAsk when it started, check power and cables, listen for beeps, test with known-good parts, change one thing at a time.'],['Install Windows','## Steps\nBack up files, make a bootable USB with the official Windows tool, boot from it, choose the drive, install, then update drivers and install an antivirus.']]],
['por','Digital Portal Skills','fa-landmark',[['Account basics','## Before you start\nUse your own email and phone, keep a strong password, and write down what you submit. Never share OTP codes with anyone.'],['Working with the portals','## Common portals\nKRA (iTax) for tax, eCitizen for government services, SHA for health cover and HELB for student loans. Always confirm the web address before logging in.'],['Helping others safely','## Good practice\nAgree the price first, never keep other people\'s passwords, and give the client a copy of what you submitted.']]],
['vid','Video Editing & Content','fa-film',[['Plan your video','## Plan first\nWrite the goal, the hook (first 3 seconds), the main points and a call to action. Shoot in good light and keep sound clear.'],['CapCut basics','## Editing flow\nImport clips, trim, add captions, add music at low volume, then export in 1080p. Vertical 9:16 suits Reels and Shorts.'],['Thumbnails','## Thumbnails\nOne face or object, big readable words (3 or fewer), strong contrast.']]],
['cyb','Cyber Safety & Security','fa-user-shield',[['Strong passwords','## Rules\n- Long beats complex: use a phrase of 4 words or more\n- Never reuse a password\n- Turn on two-step verification\n- Use a password manager'],['Spot phishing','## Warning signs\nUrgent threats, odd sender addresses, links that do not match the real site, requests for PINs or OTP. When unsure, go to the website yourself.'],['Secure your devices','## Habits\nInstall updates, lock your screen, back up important files, and avoid public Wi-Fi for banking.']]],
['prog','Programming Basics','fa-code',[['Thinking like a programmer','## Logic\nBreak a problem into small steps. Write the steps in plain words first (pseudocode), then in code.'],['Python: first steps','## Python\nname = input("Name: ")\nprint("Hello", name)\n- Variables store values\n- if / else make decisions\n- for loops repeat'],['Mini project','## Try this\nBuild a number guessing game: pick a random number, ask for guesses, and say higher or lower until correct.']]]];
/*
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),Q=i=>document.getElementById(i);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const nm=n=>n.trim().toLowerCase().replace(/\s+/g,' ');
let L={students:[],classes:[]},me=null,adm=false,fails=0,lock=0;
try{L=JSON.parse(localStorage.getItem('pt_admin'))||L}catch(e){}
async function load(){if(!localStorage.getItem('pt_admin')&&location.protocol.startsWith('http'))try{const r=await fetch('portal-data.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const j=await r.json();L={students:(j.students||[]).map(s=>({id:s.id,h:s.h,courses:s.courses,active:s.active,name:'(hidden)'})),classes:j.classes||[]}}}catch(e){}}
function txt(t){let o='',u=0;t.split('\n').forEach(l=>{if(l.startsWith('- ')){if(!u){o+='<ul>';u=1}o+='<li>'+E(l.slice(2))+'</li>'}else{if(u){o+='</ul>';u=0}o+=l.startsWith('## ')?'<h4>'+E(l.slice(3))+'</h4>':'<p>'+E(l)+'</p>'}});return o+(u?'</ul>':'')}
async function login(){if(Date.now()<lock)return Q('le').textContent='Too many tries. Wait a minute.';const n=nm(Q('ln').value),p=Q('lp').value;if(!n||!p)return Q('le').textContent='Enter your full name and password.';
const h=await sha(n+'|'+p),s=L.students.find(x=>x.h===h&&x.active!==false);if(!s){if(++fails>=5){lock=Date.now()+6e4;fails=0}return Q('le').textContent='Name or password is not correct.'}
me=s;sessionStorage.setItem('pt_me',h);show(Q('ln').value.trim())}
function show(name){Q('login').classList.add('hide');Q('app').classList.remove('hide');Q('out').classList.remove('hide');Q('hi').textContent='Welcome, '+name;
Q('sub').textContent='You are enrolled in '+me.courses.map(c=>(CO.find(x=>x[0]===c)||[])[1]).filter(Boolean).join(', ');sessionStorage.setItem('pt_n',name);tab(1)}
function logout(){sessionStorage.clear();location.reload()}
const dn=()=>JSON.parse(localStorage.getItem('pt_done_'+me.h)||'{}');
function tab(n){Q('t1').classList.toggle('on',n==1);Q('t2').classList.toggle('on',n==2);Q('v1').classList.toggle('hide',n!=1);Q('v2').classList.toggle('hide',n!=2);n==1?courses():classes()}
function courses(){const d=dn();Q('v1').innerHTML=CO.filter(c=>me.courses.includes(c[0])).map(c=>{const t=c[3].length,k=c[3].filter((_,i)=>d[c[0]+i]).length;return'<div class="card"><h3><i class="fa-solid '+c[2]+'" style="color:#22c55e"></i> '+E(c[1])+'</h3><p>'+k+' of '+t+' lessons done</p><div class="bar"><i style="width:'+k/t*100+'%"></i></div>'+c[3].map((l,i)=>'<div class="les'+(d[c[0]+i]?' done':'')+'" onclick="les(\''+c[0]+'\','+i+')"><i class="fa-solid fa-circle-check"></i>'+E(l[0])+'</div>').join('')+'</div>'}).join('')||'<div class="card"><p>No courses assigned yet. Contact SITA-TECH.</p></div>'}
function les(c,i){const C=CO.find(x=>x[0]===c),l=C[3][i],d=dn();Q('v1').innerHTML='<div class="card"><button class="b g" onclick="courses()"><i class="fa-solid fa-arrow-left"></i> Back</button><h2 style="margin-top:.5rem">'+E(l[0])+'</h2><div class="tx">'+txt(l[1])+'</div><button class="b f" onclick="done(\''+c+'\','+i+')">'+(d[c+i]?'Marked done. Back to list':'Mark as done')+'</button></div>'}
function done(c,i){const d=dn();d[c+i]=1;localStorage.setItem('pt_done_'+me.h,JSON.stringify(d));courses()}
function classes(){const now=Date.now(),l=L.classes.filter(c=>c.course==='all'||me.courses.includes(c.course)).sort((a,b)=>new Date(a.when)-new Date(b.when));
Q('v2').innerHTML=l.map(c=>{const t=new Date(c.when).getTime(),on=now>t-18e5&&now<t+108e5;return'<div class="card'+(on?' live':'')+'"><h3>'+E(c.title)+'</h3><p>'+new Date(c.when).toLocaleString()+(t<now-108e5?' (finished)':'')+'</p><a class="b f '+(on?'':'y')+'" target="_blank" rel="noopener" href="'+E(c.link)+'"><i class="fa-solid fa-video"></i>'+(on?'Join class now':'Open class link')+'</a></div>'}).join('')||'<div class="card"><p>No live classes shared yet.</p></div>'}
// ---- admin ----
function openAdm(){const p=prompt('Admin PIN');if(!p)return;sha('sita-portal|'+p).then(h=>{if(h!==PIN)return alert('Wrong PIN');adm=true;['login','app'].forEach(i=>Q(i).classList.add('hide'));Q('adm').classList.remove('hide');Q('out').classList.remove('hide');Q('sc').innerHTML=CO.map(c=>'<label style="display:inline-block;margin:.15rem .5rem .15rem 0"><input type="checkbox" value="'+c[0]+'"> '+E(c[1])+'</label>').join('');Q('cc').innerHTML='<option value="all">All students</option>'+CO.map(c=>'<option value="'+c[0]+'">'+E(c[1])+'</option>').join('');rl()})}
document.addEventListener('keydown',e=>{if(e.shiftKey&&e.code==='Digit0'&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();openAdm()}});let tp=0;Q('logo').onclick=()=>{if(++tp>=7){tp=0;openAdm()}};
function at(n){[1,2,3].forEach(i=>Q('a'+i).classList.toggle('hide',i!=n))}
const sv=()=>{localStorage.setItem('pt_admin',JSON.stringify(L));rl()};
const pw=()=>{const a='abcdefghjkmnpqrstuvwxyz23456789';let o='';crypto.getRandomValues(new Uint8Array(8)).forEach(x=>o+=a[x%a.length]);return o};
async function addStu(){const n=Q('sn').value.trim(),c=[...document.querySelectorAll('#sc input:checked')].map(x=>x.value);if(!n||!c.length)return alert('Enter the name and tick at least one course');if(!Q('sp').checked)return alert('Tick the box to confirm the fee payment first');
const p=pw(),h=await sha(nm(n)+'|'+p);L.students=L.students.filter(s=>s.h!==h);L.students.push({id:Date.now(),name:n,phone:Q('sph').value.replace(/\D/g,''),h,courses:c,active:true});sv();
const msg='Hello '+n+', your SITA-TECH Student Portal login is ready.\nUsername (full name): '+n+'\nPassword: '+p+'\nLogin: '+location.href.split('?')[0];
const ph=Q('sph').value.replace(/\D/g,'').replace(/^0/,'254');Q('sres').innerHTML='Login created. Password: <b>'+p+'</b> (shown once) <a class="b" target="_blank" href="https://wa.me/'+ph+'?text='+encodeURIComponent(msg)+'">Send on WhatsApp</a>';Q('sn').value='';Q('sp').checked=false}
function rl(){Q('sl').innerHTML='<table>'+L.students.map(s=>'<tr><td>'+E(s.name)+'<br><span style="color:#71717a">'+s.courses.map(c=>(CO.find(x=>x[0]===c)||[])[1]).join(', ')+'</span></td><td><button class="b g" onclick="tg('+s.id+')">'+(s.active===false?'Activate':'Block')+'</button> <button class="b r" onclick="rm('+s.id+')">X</button></td></tr>').join('')+'</table>';
Q('cl2').innerHTML=L.classes.map((c,i)=>'<p>'+E(c.title)+' - '+new Date(c.when).toLocaleString()+' <button class="b r" onclick="L.classes.splice('+i+',1);sv()">X</button></p>').join('')}
function tg(id){const s=L.students.find(x=>x.id===id);s.active=s.active===false;sv()}function rm(id){if(confirm('Delete this student?')){L.students=L.students.filter(x=>x.id!==id);sv()}}
function addCls(){const t=Q('cn').value.trim(),w=Q('cd').value,l=Q('cl').value.trim();if(!t||!w||!/^https?:\/\//i.test(l))return alert('Add a title, date and a link starting with https://');L.classes.push({title:t,course:Q('cc').value,when:w,link:l});sv();['cn','cd','cl'].forEach(i=>Q(i).value='')}
const pub=()=>JSON.stringify({students:L.students.map(s=>({id:s.id,h:s.h,courses:s.courses,active:s.active})),classes:L.classes});
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click()}
load().then(async()=>{const h=sessionStorage.getItem('pt_me');if(h){const s=L.students.find(x=>x.h===h);if(s){me=s;show(sessionStorage.getItem('pt_n')||'student')}}});
*/
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),Q=i=>document.getElementById(i);
let me=null,completed=new Set(),classSessions=[];
function txt(t){let o='',u=0;t.split('\n').forEach(l=>{if(l.startsWith('- ')){if(!u){o+='<ul>';u=1}o+='<li>'+E(l.slice(2))+'</li>'}else{if(u){o+='</ul>';u=0}o+=l.startsWith('## ')?'<h4>'+E(l.slice(3))+'</h4>':'<p>'+E(l)+'</p>'}});return o+(u?'</ul>':'')}
function showError(message,target='portalError'){Q(target).textContent=message}
async function loadAccount(user){
    showError('');
    const {data: enrollments,error: enrollmentError}=await supabase.from('sita_enrollments').select('course_code').eq('status','active');
    if(enrollmentError)throw enrollmentError;
    me={id:user.id,courses:enrollments.map(row=>row.course_code)};
    const [{data: progress,error: progressError},{data: sessions,error: sessionsError}]=await Promise.all([
        supabase.from('sita_module_progress').select('course_code,module_key'),
        supabase.from('sita_class_sessions').select('title,course_code,starts_at,meeting_url').order('starts_at')
    ]);
    if(progressError)throw progressError;
    if(sessionsError)throw sessionsError;
    completed=new Set(progress.map(row=>row.course_code+row.module_key));
    classSessions=sessions;
    Q('login').classList.add('hide');
    Q('app').classList.remove('hide');
    Q('out').classList.remove('hide');
    Q('hi').textContent='Welcome, '+(user.user_metadata.full_name||user.email||'student');
    Q('sub').textContent='You are enrolled in '+me.courses.map(c=>(CO.find(x=>x[0]===c)||[])[1]).filter(Boolean).join(', ');
    tab(1);
}
async function login(){
    showError('', 'le');
    const email=Q('ln').value.trim(),password=Q('lp').value;
    if(!email||!password)return showError('Enter your email and password.', 'le');
    try{
        const {data,error}=await supabase.auth.signInWithPassword({email,password});
        if(error){showError('Email or password is incorrect.', 'le');console.error('Student sign-in failed:',error);return}
        await loadAccount(data.user);
    }catch(error){showError('Could not sign in or load student data. Please try again.','le');console.error('Student sign-in failed:',error)}
}
async function logout(){
    try{
        const {error}=await supabase.auth.signOut();
        if(error)throw error;
        me=null;completed.clear();classSessions=[];
        Q('login').classList.remove('hide');Q('app').classList.add('hide');Q('out').classList.add('hide');
    }catch(error){showError('Could not sign out. Please try again.');console.error('Student sign-out failed:',error)}
}
function tab(n){Q('t1').classList.toggle('on',n===1);Q('t2').classList.toggle('on',n===2);Q('v1').classList.toggle('hide',n!==1);Q('v2').classList.toggle('hide',n!==2);n===1?courses():classes()}
function courses(){Q('v1').innerHTML=CO.filter(c=>me&&me.courses.includes(c[0])).map(c=>{const t=c[3].length,k=c[3].filter((_,i)=>completed.has(c[0]+c[0]+i)).length;return'<div class="card"><h3><i class="fa-solid '+c[2]+'" style="color:#22c55e"></i> '+E(c[1])+'</h3><p>'+k+' of '+t+' lessons done</p><div class="bar"><i style="width:'+k/t*100+'%"></i></div>'+c[3].map((l,i)=>'<div class="les'+(completed.has(c[0]+c[0]+i)?' done':'')+'" onclick="les(\''+c[0]+'\','+i+')"><i class="fa-solid fa-circle-check"></i>'+E(l[0])+'</div>').join('')+'</div>'}).join('')||'<div class="card"><p>No courses assigned yet. Contact SITA-TECH.</p></div>'}
function les(c,i){const C=CO.find(x=>x[0]===c),l=C[3][i],key=c+c+i;Q('v1').innerHTML='<div class="card"><button class="b g" onclick="courses()"><i class="fa-solid fa-arrow-left"></i> Back</button><h2 style="margin-top:.5rem">'+E(l[0])+'</h2><div class="tx">'+txt(l[1])+'</div><button class="b f" onclick="done(\''+c+'\','+i+')">'+(completed.has(key)?'Marked done. Back to list':'Mark as done')+'</button></div>'}
async function done(c,i){
    if(!me)return;
    const key=c+c+i;
    if(completed.has(key))return courses();
    try{
        const {error}=await supabase.from('sita_module_progress').upsert({student_id:me.id,course_code:c,module_key:c+i,completed_at:new Date().toISOString()},{onConflict:'student_id,course_code,module_key'});
        if(error)throw error;
        completed.add(key);showError('');courses();
    }catch(error){showError('Could not save your lesson progress. Please try again.');console.error('Lesson progress update failed:',error)}
}
function classes(){const now=Date.now(),l=classSessions.filter(c=>c.course_code==='all'||me.courses.includes(c.course_code)).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
Q('v2').innerHTML=l.map(c=>{const t=new Date(c.starts_at).getTime(),on=now>t-18e5&&now<t+108e5;return'<div class="card'+(on?' live':'')+'"><h3>'+E(c.title)+'</h3><p>'+new Date(c.starts_at).toLocaleString()+(t<now-108e5?' (finished)':'')+'</p><a class="b f '+(on?'':'y')+'" target="_blank" rel="noopener" href="'+E(c.meeting_url)+'"><i class="fa-solid fa-video"></i>'+(on?'Join class now':'Open class link')+'</a></div>'}).join('')||'<div class="card"><p>No live classes shared yet.</p></div>'}
Object.assign(window,{login,logout,tab,courses,les,done});
try{
    const {data:{session},error}=await supabase.auth.getSession();
    if(error)throw error;
    if(session)await loadAccount(session.user);
}catch(error){showError('Could not restore your student session. Please sign in again.','le');console.error('Session restore failed:',error)}
</script></body></html>
