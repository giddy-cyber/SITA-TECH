<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll | SITA-TECH Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0C;
            overflow-x: hidden;
        }

        .animated-card {
            background: rgba(18, 18, 22, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(34, 197, 94, 0.1);
        }

        /* Diagonal background split matching the video across all screen sizes */
        .hero-panel {
            background: linear-gradient(135deg, #052e16 0%, #15803d 50%, #22c55e 100%);
            clip-path: polygon(0 0, 100% 0, 82% 100%, 0% 100%);
        }

        .fade-slide-in {
            animation: fadeSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animated-input {
            transition: all 0.2s ease;
        }
        .animated-input:focus {
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.25);
        }

        @media (max-width: 767px) { 
            input, select, textarea { font-size: 11px !important; } 
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between relative selection:bg-green-500 selection:text-black">

    <!-- Header Navigation -->
    <header class="border-b border-zinc-800/80 bg-[#0A0A0C]/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-3 h-10 flex items-center justify-between">
            <a href="index.html#academy" class="text-[10px] sm:text-xs font-semibold text-zinc-400 hover:text-white transition-colors flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Back to Academy
            </a>
            <span class="font-black tracking-tight text-white text-xs sm:text-sm">SITA-TECH <span class="text-green-500">Academy</span></span>
        </div>
    </header>

    <!-- Main Content Container: Top-aligned to start at top of mobile screen -->
    <main class="max-w-xl mx-auto px-2 pt-2 sm:pt-4 pb-4 w-full flex-grow flex items-start justify-center z-10">

        <!-- Horizontal Partitioned Card across ALL Screen Sizes -->
        <div class="w-full animated-card rounded-xl overflow-hidden grid grid-cols-12 fade-slide-in">
            
            <!-- Left Side: Diagonal Hero Panel (5 columns) -->
            <div class="col-span-5 hero-panel p-2.5 sm:p-5 flex flex-col justify-between relative overflow-hidden text-white">
                <div class="relative z-10">
                    <span class="inline-block px-1.5 py-0.5 rounded-full bg-black/20 text-green-200 text-[8px] sm:text-[9px] font-bold uppercase tracking-wider mb-1 border border-white/10">
                        Student Portal
                    </span>
                    <h2 class="text-xs sm:text-xl font-black tracking-tight leading-tight">
                        WELCOME ABOARD!
                    </h2>
                    <p class="mt-1 text-green-100/90 text-[9px] sm:text-xs leading-tight font-medium hidden xs:block">
                        Reserve your spot for full course access.
                    </p>
                </div>

                <div class="pt-2 border-t border-white/15 relative z-10 flex flex-col gap-1 text-[9px] text-green-100/80">
                    <div class="flex items-center gap-1">
                        <i class="fa-solid fa-shield-halved text-green-300 text-[8px]"></i>
                        <span class="truncate">Verified Registration</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Form Panel (7 columns) -->
            <div class="col-span-7 p-2.5 sm:p-5 flex flex-col justify-center">
                
                <div id="formView">
                    <div class="mb-1.5 sm:mb-2.5">
                        <span class="text-green-500 font-bold text-[8px] sm:text-[9px] uppercase tracking-widest">Application</span>
                        <h1 class="text-xs sm:text-lg font-black text-white mt-0">Enroll Now</h1>
                    </div>

                    <form id="enrollForm" class="space-y-1.5 sm:space-y-2">
                        <div>
                            <label for="course" class="block text-[9px] sm:text-[10px] font-semibold text-zinc-300 mb-0.5">Course</label>
                            <input id="course" name="Course" type="text" readonly class="w-full bg-zinc-950/80 border border-zinc-800 rounded py-1 px-2 text-[10px] sm:text-xs text-green-400 font-bold outline-none">
                        </div>

                        <div id="topicsWrap" class="hidden">
                            <label for="topics" class="block text-[9px] sm:text-[10px] font-semibold text-zinc-300 mb-0.5">Topics</label>
                            <input id="topics" name="Topics" type="text" readonly class="w-full bg-zinc-950/80 border border-zinc-800 rounded py-1 px-2 text-[10px] sm:text-xs text-zinc-300 outline-none">
                        </div>

                        <div>
                            <label for="fullName" class="block text-[9px] sm:text-[10px] font-semibold text-zinc-300 mb-0.5">Full Name</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-zinc-500 text-[9px]"><i class="fa-regular fa-user"></i></span>
                                <input id="fullName" name="Official Name" type="text" required autocomplete="name" placeholder="As on ID" class="animated-input w-full bg-zinc-950/80 border border-zinc-800 focus:border-green-500 outline-none rounded py-1 pl-6 pr-2 text-[10px] sm:text-xs text-white">
                            </div>
                        </div>

                        <div>
                            <label for="email" class="block text-[9px] sm:text-[10px] font-semibold text-zinc-300 mb-0.5">Email</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-zinc-500 text-[9px]"><i class="fa-regular fa-envelope"></i></span>
                                <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" class="animated-input w-full bg-zinc-950/80 border border-zinc-800 focus:border-green-500 outline-none rounded py-1 pl-6 pr-2 text-[10px] sm:text-xs text-white">
                            </div>
                        </div>

                        <div>
                            <label for="phone" class="block text-[9px] sm:text-[10px] font-semibold text-zinc-300 mb-0.5">Phone</label>
                            <div class="relative">
                                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-zinc-500 text-[9px]"><i class="fa-solid fa-phone"></i></span>
                                <input id="phone" name="Phone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="07XX XXX XXX" class="animated-input w-full bg-zinc-950/80 border border-zinc-800 focus:border-green-500 outline-none rounded py-1 pl-6 pr-2 text-[10px] sm:text-xs text-white">
                            </div>
                        </div>

                        <!-- Honeypot field for spam protection -->
                        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hidden">
                        <p id="errorMsg" class="hidden text-[10px] text-red-400 bg-red-950/40 border border-red-800/50 p-1.5 rounded"></p>

                        <button id="submitBtn" type="submit" class="w-full py-1.5 sm:py-2 rounded bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-500 hover:to-emerald-400 text-white font-extrabold text-[10px] sm:text-xs shadow-md transition-all mt-0.5">
                            Submit Enrolment
                        </button>
                    </form>
                </div>

                <div id="doneView" class="hidden text-center py-2 fade-slide-in">
                    <div class="w-8 h-8 sm:w-12 sm:h-12 mx-auto rounded-full bg-green-500/20 border border-green-500/50 flex items-center justify-center text-green-400 text-sm sm:text-xl animate-bounce">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h2 class="text-xs sm:text-lg font-black text-white mt-1.5">You're enrolled!</h2>
                    <p id="doneText" class="text-zinc-400 text-[9px] sm:text-xs mt-0.5 leading-snug">
                        Thank you. SITA-TECH will contact you soon.
                    </p>
                    <a href="index.html#academy" class="inline-flex items-center gap-1 mt-2 px-3 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-white text-[10px] font-bold transition-all">
                        <i class="fa-solid fa-house"></i> Home
                    </a>
                </div>

            </div>
        </div>

    </main>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const params = new URLSearchParams(location.search);
        const course = params.get('course') || '';
        const topics = params.get('topics') || '';
        
        document.getElementById('course').value = course || 'General enquiry';
        if (topics) {
            document.getElementById('topics').value = topics;
            document.getElementById('topicsWrap').classList.remove('hidden');
        }

        document.getElementById('enrollForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorMsg');
            
            err.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const data = new FormData(this);

            try {
                if (data.get('_gotcha')) throw new Error('Spam submission rejected');
                const { error } = await supabase.from('sita_enrollment_applications').insert({
                    full_name: data.get('Official Name'),
                    email: data.get('email'),
                    phone: data.get('Phone'),
                    course_name: data.get('Course'),
                    topics: data.get('Topics') || null
                });
                if (error) throw error;

                document.getElementById('doneText').textContent = 'Thank you, ' + data.get('Official Name').split(' ')[0] + '. Your details for ' + (course || 'the Academy') + ' were sent. SITA-TECH will contact you on ' + data.get('Phone') + '.';
                
                const formView = document.getElementById('formView');
                formView.classList.add('opacity-0', 'transition-opacity', 'duration-200');
                setTimeout(() => {
                    formView.classList.add('hidden');
                    document.getElementById('doneView').classList.remove('hidden');
                }, 200);

            } catch (error) {
                console.error('Enrollment submission failed:', error);
                if (error.code === 'PGRST205' || error.code === '42P01') {
                    err.textContent = 'Enrollment is not set up yet. The site administrator must run the Supabase database setup, then try again.';
                } else if (error.code === '42501' || error.code === 'PGRST301') {
                    err.textContent = 'Supabase blocked this submission. The site administrator must check the enrollment table permissions and Row Level Security policy.';
                } else if (error.message === 'Spam submission rejected') {
                    err.textContent = 'Submission could not be accepted. Please reload the form and try again.';
                } else {
                    err.textContent = 'Could not send your details (' + (error.code || 'network error') + '). Please try again or call 0795609046.';
                }
                err.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Submit Enrolment';
            }
        });
    </script>
</body>
</html>
