<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll | SITA-TECH Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media (max-width: 767px) { input, select, textarea { font-size: 16px !important; } }
    </style>
</head>
<body class="bg-[#0A0A0C] text-gray-100 min-h-screen">

    <header class="border-b border-zinc-800/80 bg-[#0A0A0C]/90">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html#academy" class="text-sm font-semibold text-zinc-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Academy</a>
            <span class="font-black tracking-tight text-white">SITA-TECH <span class="text-green-500">Academy</span></span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-10">

        <div id="formView">
            <span class="text-green-500 font-bold text-xs uppercase tracking-widest">Student Enrolment</span>
            <h1 class="text-3xl font-black text-white mt-1">Enroll now</h1>
            <p class="text-zinc-400 text-sm mt-2">Fill in your details and SITA-TECH will contact you with fees and class times.</p>

            <form id="enrollForm" class="mt-8 space-y-4 bg-zinc-900 border border-zinc-800 rounded-3xl p-6">
                <div>
                    <label for="course" class="block text-xs font-semibold text-zinc-300 mb-1">Course</label>
                    <input id="course" name="Course" type="text" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-green-400 font-bold">
                </div>
                <div id="topicsWrap" class="hidden">
                    <label for="topics" class="block text-xs font-semibold text-zinc-300 mb-1">Selected topics</label>
                    <input id="topics" name="Topics" type="text" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-300">
                </div>
                <div>
                    <label for="fullName" class="block text-xs font-semibold text-zinc-300 mb-1">Official full name</label>
                    <input id="fullName" name="Official Name" type="text" required autocomplete="name" placeholder="As on your ID" class="w-full bg-zinc-950 border border-zinc-800 focus:border-green-500 outline-none rounded-xl p-3 text-sm text-white">
                </div>
                <div>
                    <label for="email" class="block text-xs font-semibold text-zinc-300 mb-1">Email address</label>
                    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full bg-zinc-950 border border-zinc-800 focus:border-green-500 outline-none rounded-xl p-3 text-sm text-white">
                </div>
                <div>
                    <label for="phone" class="block text-xs font-semibold text-zinc-300 mb-1">Phone number</label>
                    <input id="phone" name="Phone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="07XX XXX XXX" class="w-full bg-zinc-950 border border-zinc-800 focus:border-green-500 outline-none rounded-xl p-3 text-sm text-white">
                </div>

                <!-- honeypot field for spam protection -->
                <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="hidden">

                <p id="errorMsg" class="hidden text-xs text-red-400"></p>

                <button id="submitBtn" type="submit" class="w-full py-3.5 rounded-xl bg-green-600 hover:bg-green-500 text-white font-extrabold text-sm shadow-lg shadow-green-900/40 transition-all">
                    Submit Enrolment
                </button>
            </form>
        </div>

        <div id="doneView" class="hidden text-center bg-zinc-900 border border-green-500/30 rounded-3xl p-8">
            <div class="w-14 h-14 mx-auto rounded-full bg-green-500/15 border border-green-500/40 flex items-center justify-center text-green-400 text-2xl"><i class="fa-solid fa-check"></i></div>
            <h2 class="text-2xl font-black text-white mt-4">You're enrolled!</h2>
            <p id="doneText" class="text-zinc-400 text-sm mt-2">Thank you. SITA-TECH will contact you soon.</p>
            <a href="index.html#academy" class="inline-block mt-6 px-6 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-bold">Back to Academy</a>
        </div>

    </main>

    <script type="module">
        import { supabase } from './supabaseClient.js';

        const params = new URLSearchParams(location.search);
        const course = params.get('course') || '';
        const topics = params.get('topics') || '';
        
        document.getElementById('course').value = course || 'General enquiry';
        if (topics) {
            document.getElementById('topics').value = topics;
            document.getElementById('topicsWrap').classList.remove('hidden');
        }

        document.getElementById('enrollForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorMsg');
            
            err.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const data = new FormData(this);

            try {
                if (data.get('_gotcha')) throw new Error('Spam submission rejected');
                const { error } = await supabase.from('sita_enrollment_applications').insert({
                    full_name: data.get('Official Name'),
                    email: data.get('email'),
                    phone: data.get('Phone'),
                    course_name: data.get('Course'),
                    topics: data.get('Topics') || null
                });
                if (error) throw error;

                document.getElementById('doneText').textContent = 'Thank you, ' + data.get('Official Name').split(' ')[0] + '. Your details for ' + (course || 'the Academy') + ' were sent. SITA-TECH will contact you on ' + data.get('Phone') + '.';
                document.getElementById('formView').classList.add('hidden');
                document.getElementById('doneView').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
            } catch (error) {
                console.error('Enrollment submission failed:', error);
                if (error.code === 'PGRST205' || error.code === '42P01') {
                    err.textContent = 'Enrollment is not set up yet. The site administrator must run the Supabase database setup, then try again.';
                } else if (error.code === '42501' || error.code === 'PGRST301') {
                    err.textContent = 'Supabase blocked this submission. The site administrator must check the enrollment table permissions and Row Level Security policy.';
                } else if (error.message === 'Spam submission rejected') {
                    err.textContent = 'Submission could not be accepted. Please reload the form and try again.';
                } else {
                    err.textContent = 'Could not send your details (' + (error.code || 'network error') + '). Please try again or call 0795609046.';
                }
                err.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Submit Enrolment';
            }
        });
    </script>
</body>
</html>
